[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-simulation"
version = "0.1.0"
description = "Experimental orchestration scaffold for network simulation studies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "bc-python-hcl2==0.4.3",
]

[project.optional-dependencies]
copilot = [
  "github-copilot-sdk==1.0.22",
]
azure-auth = [
  "azure-identity>=1.23,<2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
network_simulation = ["prompts/*.md", "web/*.mjs", "web/public/*.html", "web/public/*.css", "web/public/*.js", "web/public/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
