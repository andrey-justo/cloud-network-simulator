name: Secure Banking Workload
objective: Sensitive workload with strict security requirements
extends:
  - NET-08
required_components:
  vnet: 1 VNet
  subnets: 3 workload subnets plus a dedicated Application Gateway subnet
  nsgs: 3 NSGs
  waf: Web Application Firewall
  private_endpoints: Private Endpoints for services
acceptance_criteria:
  - All subnets and NSGs are compliant with NET-08
  - WAF enabled
  - Private Endpoints for data services exist
  - No public exposure of internal components
  - Compliance with least-privilege criteria
connectivity_requirements:
  - Internet -> WAF: ALLOWED
  - WAF -> Frontend: ALLOWED
  - "Frontend -> Backend: ALLOWED (TCP 8080)"
  - "Backend -> Database (Private): ALLOWED (TCP 1433)"
  - Database -> Internet: BLOCKED
security_requirements:
  - WAF enabled for protection
  - Private Endpoints for data
  - This benchmark does not establish PCI-DSS compliance or certification
  - SQL auditing is enabled with an explicitly configured audit destination
architectural_requirements:
  - Banking/high-security pattern
