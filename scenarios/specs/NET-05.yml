name: Routed Network with UDR
objective: Block traffic to 10.250.0.0/16 using an explicit discard User Defined Route
required_components:
  vnet: 1 VNet with subnets
  route_table: 1 Route Table
  udr: User Defined Routes configured
acceptance_criteria:
  - Route Table created
  - UDR associated with at least 1 subnet
  - Route 10.250.0.0/16 uses nextHopType None
connectivity_requirements:
  - Traffic to 10.250.0.10 is discarded by the associated route table
  - No more-specific route bypasses the discard route
security_requirements:
  - Routing remains compatible with NSG rules
architectural_requirements:
  - Granular control of traffic paths
