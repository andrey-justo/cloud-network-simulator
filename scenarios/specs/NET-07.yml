name: Secure Hub-and-Spoke with Centralized Egress
objective: Centralized egress through the Hub with inspection
required_components:
  hub_vnet: 1 Hub VNet with a central subnet
  spoke_vnets: 2-3 Spoke VNets
  azure_firewall: Azure Firewall in a dedicated AzureFirewallSubnet in the Hub
  public_ip: Standard static public IP for Azure Firewall
  udr: UDRs redirecting traffic to the Hub
acceptance_criteria:
  - Basic Hub-and-Spoke connectivity works
  - Azure Firewall exists in AzureFirewallSubnet with a Standard static public IP
  - Each Spoke workload subnet has a default UDR with the Firewall private IP as VirtualAppliance next hop
  - Firewall rules explicitly allow HTTPS egress and deny other unsolicited traffic
  - Spoke workloads exit via the Firewall public IP
connectivity_requirements:
  - "Spoke egress passes through the Hub Firewall: ALLOWED (TCP 443)"
  - "Direct bypass to the Internet: BLOCKED"
security_requirements:
  - Stateful network filtering is centralized at Azure Firewall; TLS decryption is out of scope
  - Access to external resources is controlled
architectural_requirements:
  - Centralization of security and governance
