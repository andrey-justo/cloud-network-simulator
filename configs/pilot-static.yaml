poc:
  name: Azure network IaC - two-model exploratory static pilot
experiment:
  phase: pilot
  scenarios: [NET-01, NET-02, NET-03, NET-04, NET-05, NET-06, NET-07, NET-08, NET-09, NET-10]
  output_directory: results/pilot-static
study:
  repetitions: 5
  max_iterations: 5
  random_seed: 1729
  models: [gpt-5.3-codex, gpt-6.1-sol]
  bootstrap_samples: 2000
  input_usd_per_million: null
  output_usd_per_million: null
llm:
  provider: copilot
  model: gpt-5.3-codex
  max_tokens: 8000
validation:
  bicep_syntax: true
  checkov: true
  opa: true
cloud:
  enabled: false
